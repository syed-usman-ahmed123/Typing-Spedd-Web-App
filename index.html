<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="style.css" rel="stylesheet">
  <link href="/src/output.css" rel="stylesheet">

  <title>Frontend Mentor | Typing Speed Test</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body class="bg-[var(--neutral-900)] text-[var(--neutral-0)] font-[family-name:var(--font-family)] min-h-screen">

  <!-- ========== HEADER ========== -->
  <header class="border-b border-[var(--neutral-800)]">
    <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">


      <!-- Logo + Title -->
      <div class="flex items-center gap-3">

        <!-- Desktop Logo  -->
        <img src="./assets/images/logo-large.svg" alt="Typing Speed Test" class="hidden lg:block h-10">

        <!-- Mobile Logo  -->
        <div class="flex items-center gap-3 lg:hidden">
          <img src="./assets/images/logo-small.svg" alt="Typing Speed Test" class="h-8">

          <div>
            <h1 class="text-lg font-semibold leading-tight">Typing Speed Test</h1>
            <p class="text-sm text-[var(--neutral-400)]">Type as fast as you can in 60 seconds</p>
          </div>
        </div>

      </div>

      <!-- Personal Best -->
      <div class="flex items-center gap-2 text-sm">
        <img src="./assets/images/icon-personal-best.svg" alt="Trophy" class="w-5 h-5">
        <span class="text-[var(--neutral-400)] hidden sm:inline">Personal best:</span>
        <span class="font-semibold" id="personal-best">0 WPM</span>
      </div>
    </div>
  </header>

  <!-- ========== STATS BAR ========== -->
  <div class="border-b border-[var(--neutral-800)]">
    <div class="max-w-6xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">

      <!-- Left Stats -->
      <div class="flex items-center gap-6 text-sm">
        <div>
          <span class="text-[var(--neutral-400)]">WPM: </span>
          <span class="font-semibold" id="wpm">0</span>
        </div>
        <div>
          <span class="text-[var(--neutral-400)]">Accuracy: </span>
          <span class="font-semibold text-[var(--red-500)]" id="accuracy">100%</span>
        </div>
        <div>
          <span class="text-[var(--neutral-400)]">Time: </span>
          <span class="font-semibold text-[var(--yellow-400)]" id="timer">0:60</span>
        </div>
      </div>

      <!-- Right Controls -->
      <div class="flex items-center gap-6 text-sm">
        <!-- Difficulty -->
        <div class="flex items-center gap-2">
          <span class="text-[var(--neutral-400)]">Difficulty:</span>
          <div class="flex gap-1">
            <button
              class="px-3 py-1 rounded-lg border border-[var(--neutral-500)] text-[var(--neutral-400)] hover:border-[var(--blue-400)] transition"
              data-difficulty="easy">Easy</button>
            <button class="px-3 py-1 rounded-lg border border-[var(--blue-400)] text-[var(--blue-400)] transition"
              data-difficulty="medium">Medium</button>
            <button
              class="px-3 py-1 rounded-lg border border-[var(--neutral-500)] text-[var(--neutral-400)] hover:border-[var(--blue-400)] transition"
              data-difficulty="hard">Hard</button>
          </div>
        </div>

        <!-- Mode -->
        <div class="flex items-center gap-2">
          <span class="text-[var(--neutral-400)]">Mode:</span>
          <div class="flex gap-1">
            <button class="px-3 py-1 rounded-lg border border-[var(--blue-400)] text-[var(--blue-400)] transition"
              data-mode="timed">Timed (60s)</button>
            <button
              class="px-3 py-1 rounded-lg border border-[var(--neutral-500)] text-[var(--neutral-400)] hover:border-[var(--blue-400)] transition"
              data-mode="passage">Passage</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="max-w-6xl mx-auto px-6 py-16 relative min-h-[400px]">

    <!-- Typing Text Area -->
    <div id="text-display" class="text-2xl leading-relaxed text-[var(--neutral-400)] select-none max-w-4xl mx-auto">
      <!-- Text will be inserted here by JavaScript -->
    </div>

    <!-- Start Overlay -->
    <div id="start-overlay" class="absolute inset-0 flex flex-col items-center justify-center">
      <button id="start-btn"
        class="px-8 py-3 bg-[var(--blue-600)] hover:bg-[var(--blue-400)] text-white font-semibold rounded-xl transition">
        Start Typing Test
      </button>
      <p class="mt-4 text-[var(--neutral-400)] text-sm">Or click the text and start typing</p>
    </div>
  </main>

  <!-- ========== RESTART BUTTON ========== -->
  <div class="max-w-6xl mx-auto px-6 text-center pb-10">
    <button id="restart-btn"
      class="hidden px-6 py-2.5 bg-[var(--neutral-800)] hover:bg-[var(--neutral-500)] rounded-xl text-sm transition">
      Restart Test ↺
    </button>
  </div>

  <!-- ========== RESULTS SCREEN ========== -->
  <div id="results-screen"
    class="hidden fixed inset-0 bg-[var(--neutral-900)] flex flex-col items-center justify-center z-50 px-6">
    <!-- Results content baad mein aayega -->
  </div>

  <footer class="attribution py-6 text-center text-[var(--neutral-500)]">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" class="text-[var(--blue-400)]">Frontend
      Mentor</a>.
    Coded by <a href="https://syedusmanahmed.vercel.app/" class="text-[var(--blue-400)]">Syed Usman Ahmed</a>.
  </footer>

  <script src="script.js"></script>
</body>

</html>
